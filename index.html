<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MDEI — Automation · Robotics · Cybersecurity</title>
  <meta name="description" content="MDEI — Specialists in automation, robotics, and cybersecurity. Based in Barcelona (BCN)." />

  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f4f4f5;
      --text-main: #111827;
      --text-muted: #6b7280;
      --text-soft: #9ca3af;
      --border-subtle: #e5e7eb;
      --border-strong: #111827;
      --accent: #111827;
      --accent-soft: rgba(17,24,39,0.06);
      --shadow-soft: 0 18px 70px rgba(15,23,42,0.12);
      --shadow-strong: 0 32px 120px rgba(15,23,42,0.24);
      --transition-fast: 180ms ease-out;
      --transition-med: 300ms ease-out;
    }

    * {
      box-sizing:border-box;
    }

    html,body {
      margin:0;
      padding:0;
      height:100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:var(--bg);
      color:var(--text-main);
      overflow-x:hidden;
      scroll-behavior:smooth;
    }

    body {
      min-height:100vh;
    }

    /* Scroll progress bar */

    .scroll-progress {
      position:fixed;
      top:0;
      left:0;
      height:2px;
      width:100%;
      background:linear-gradient(90deg, #111827, #4b5563);
      transform-origin:left center;
      transform:scaleX(0);
      z-index:40;
      pointer-events:none;
    }

    /* Header */

    header {
      position:fixed;
      top:0; left:0; right:0;
      z-index:30;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 5vw;
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(229,231,235,0.9);
      transition:box-shadow var(--transition-med), border-color var(--transition-med), padding var(--transition-med);
    }

    header.is-scrolled {
      box-shadow:0 10px 40px rgba(15,23,42,0.12);
      border-color:rgba(209,213,219,1);
      padding-top:8px;
      padding-bottom:8px;
    }

    .logo {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.18em;
    }

    .logo svg {
      width:32px;
      height:32px;
      flex-shrink:0;
    }

    .logo span {
      font-weight:700;
      white-space:nowrap;
    }

    .nav {
      display:flex;
      align-items:center;
      gap:18px;
      font-size:0.78rem;
      text-transform:uppercase;
      letter-spacing:0.16em;
    }

    .nav a {
      text-decoration:none;
      color:var(--text-soft);
      padding:4px 0;
      position:relative;
      transition:color var(--transition-fast);
    }

    .nav a::after {
      content:"";
      position:absolute;
      left:0; bottom:-2px;
      width:0;
      height:1px;
      background:var(--accent);
      transition:width var(--transition-med);
    }

    .nav a:hover {
      color:var(--text-main);
    }

    .nav a:hover::after {
      width:100%;
    }

    main {
      padding-top:84px;
    }

    /* Hero */

    .hero {
      padding:60px 5vw 72px;
      border-bottom:1px solid var(--border-subtle);
      background:linear-gradient(to bottom, #ffffff, #f9fafb);
    }

    .hero-inner {
      max-width:1120px;
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
      gap:40px;
      align-items:center;
    }

    .hero-copy {
      max-width:560px;
      position:relative;
    }

    .hero-tag {
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:0.7rem;
      text-transform:uppercase;
      letter-spacing:0.2em;
      color:var(--text-soft);
      border:1px solid var(--border-subtle);
      background:#ffffff;
      padding:4px 10px;
      margin-bottom:16px;
      box-shadow:0 10px 40px rgba(15,23,42,0.06);
      opacity:0;
      transform:translateY(16px);
      animation:fadeUp 600ms var(--transition-med) forwards;
    }

    .hero-tag-dot {
      width:8px;
      height:8px;
      background:#111827;
    }

    .hero h1 {
      font-size:clamp(2.6rem, 4.5vw, 3.6rem);
      line-height:1.03;
      margin:0 0 12px 0;
      letter-spacing:0.02em;
      font-weight:800;
      opacity:0;
      transform:translateY(20px);
      animation:fadeUp 640ms var(--transition-med) forwards;
    }

    .hero h1 span {
      color:#000;
    }

    .hero-sub {
      margin:0 0 26px 0;
      font-size:0.98rem;
      color:var(--text-muted);
      max-width:340px;
      opacity:0;
      transform:translateY(18px);
      animation:fadeUp 680ms var(--transition-med) forwards;
    }

    .hero-cta-row {
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      opacity:0;
      transform:translateY(18px);
      animation:fadeUp 720ms var(--transition-med) forwards;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 20px;
      font-size:0.78rem;
      text-transform:uppercase;
      letter-spacing:0.18em;
      border-radius:999px;
      border:1px solid #111827;
      text-decoration:none;
      cursor:pointer;
      transition:background var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast), border-color var(--transition-fast);
      white-space:nowrap;
    }

    .btn-primary {
      background:#111827;
      color:#f9fafb;
      box-shadow:0 14px 40px rgba(15,23,42,0.25);
    }

    .btn-primary:hover {
      background:#000;
      box-shadow:0 18px 60px rgba(15,23,42,0.35);
      transform:translateY(-1px);
    }

    .btn-ghost {
      background:#ffffff;
      color:var(--text-main);
      border-color:var(--border-subtle);
    }

    .btn-ghost:hover {
      border-color:#111827;
      box-shadow:0 8px 30px rgba(15,23,42,0.15);
      transform:translateY(-1px);
    }

    .btn-icon {
      font-size:0.85rem;
      transform:translateY(0.5px);
    }

    /* Hero visual (industrial panel) */

    .hero-visual {
      position:relative;
      height:280px;
      max-width:360px;
      justify-self:end;
      perspective:1200px;
    }

    .hero-panel {
      position:absolute;
      inset:0;
      background:#f3f4f6;
      border:1px solid var(--border-subtle);
      box-shadow:var(--shadow-soft);
      overflow:hidden;
      transform-style:preserve-3d;
      transform-origin:center;
      will-change:transform;
      transition:transform 180ms ease-out, box-shadow 180ms ease-out;
    }

    .hero-panel::before {
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(to bottom right, rgba(107,114,128,0.08), transparent 45%),
        linear-gradient(to top, rgba(156,163,175,0.2), transparent 50%);
      mix-blend-mode:multiply;
      pointer-events:none;
    }

    .hero-panel-grid {
      position:absolute;
      inset:10%;
      border:1px solid rgba(156,163,175,0.7);
      background-image:
        linear-gradient(rgba(209,213,219,0.9) 1px, transparent 1px),
        linear-gradient(90deg, rgba(209,213,219,0.9) 1px, transparent 1px);
      background-size:40px 40px;
      opacity:0.6;
      mix-blend-mode:multiply;
    }

    .hero-panel-scan {
      position:absolute;
      top:-40%;
      left:0; right:0;
      height:30%;
      background:linear-gradient(to bottom, transparent, rgba(156,163,175,0.55), transparent);
      opacity:0.6;
      mix-blend-mode:multiply;
      animation:scan 4s linear infinite;
    }

    .hero-panel-content {
      position:absolute;
      inset:0;
      padding:20px 22px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      pointer-events:none;
    }

    .hero-panel-title {
      font-size:0.78rem;
      text-transform:uppercase;
      letter-spacing:0.16em;
      color:#111827;
    }

    .hero-panel-main {
      font-size:0.9rem;
      text-transform:uppercase;
      letter-spacing:0.18em;
      color:#111827;
    }

    .hero-panel-tags {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      font-size:0.7rem;
      text-transform:uppercase;
      letter-spacing:0.14em;
      color:var(--text-soft);
    }

    .hero-panel-tag {
      padding:3px 7px;
      border:1px solid rgba(107,114,128,0.7);
      background:rgba(243,244,246,0.8);
    }

    @keyframes scan {
      from { transform:translateY(0); }
      to   { transform:translateY(240%); }
    }

    @keyframes fadeUp {
      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    /* Platforms section (Palantir-style list) */

    .platforms {
      padding:40px 5vw 64px;
      background:#ffffff;
    }

    .platforms-inner {
      max-width:1120px;
      margin:0 auto;
      border-top:1px solid var(--border-subtle);
      padding-top:28px;
    }

    .platforms-label {
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.22em;
      color:var(--text-soft);
      margin-bottom:16px;
    }

    .platforms-list {
      border-top:1px solid var(--border-subtle);
    }

    .platform-row {
      display:grid;
      grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;
      align-items:center;
      gap:20px;
      padding:18px 0;
      border-bottom:1px solid var(--border-subtle);
      cursor:pointer;
      position:relative;
      overflow:hidden;
    }

    .platform-row::before {
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to right, var(--accent-soft), transparent);
      opacity:0;
      transition:opacity var(--transition-med), transform var(--transition-med);
      transform:translateX(-10%);
      pointer-events:none;
    }

    .platform-name {
      font-size:1.3rem;
      font-weight:500;
    }

    .platform-desc {
      font-size:0.9rem;
      color:var(--text-muted);
    }

    .platform-index {
      font-size:0.78rem;
      color:var(--text-soft);
      text-transform:uppercase;
      letter-spacing:0.14em;
    }

    .platform-arrow {
      position:absolute;
      right:0.5rem;
      font-size:0.9rem;
      opacity:0;
      transform:translateX(-4px);
      transition:opacity var(--transition-med), transform var(--transition-med);
    }

    .platform-row:hover::before {
      opacity:1;
      transform:translateX(0);
    }

    .platform-row:hover .platform-name {
      transform:translateX(4px);
    }

    .platform-row:hover .platform-arrow {
      opacity:1;
      transform:translateX(0);
    }

    .platform-name,
    .platform-desc,
    .platform-index {
      transition:transform var(--transition-med), color var(--transition-med);
    }

    /* Contact */

    section#contact {
      padding:64px 5vw 56px;
      background:#f9fafb;
      border-top:1px solid var(--border-subtle);
    }

    .contact-inner {
      max-width:1120px;
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
      gap:40px;
      align-items:flex-start;
    }

    section#contact h3 {
      margin:0 0 8px 0;
      font-size:1.6rem;
    }

    .contact-subtitle {
      margin:0 0 14px 0;
      font-size:0.98rem;
      color:var(--text-muted);
    }

      font-size:0.78rem;
      text-transform:upperc
